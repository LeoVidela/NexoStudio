<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="30" fill="url(#logoGradient)" />
  
  <!-- Modern "N" design with connection symbolism -->
  <g fill="white" fill-rule="evenodd">
    <!-- Left vertical bar -->
    <rect x="45" y="60" width="18" height="80" rx="4" />
    
    <!-- Diagonal connecting bar (representing connection/nexo) -->
    <path d="M 63 60 L 137 140 L 125 140 L 51 60 Z" opacity="0.9" />
    
    <!-- Right vertical bar -->
    <rect x="137" y="60" width="18" height="80" rx="4" />
    
    <!-- Small connecting dots for tech feel -->
    <circle cx="54" cy="70" r="5" opacity="0.7" />
    <circle cx="146" cy="130" r="5" opacity="0.7" />
    
    <!-- Abstract connection lines -->
    <path d="M 100 50 Q 120 50 120 70" stroke="white" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round" />
    <path d="M 80 130 Q 80 150 100 150" stroke="white" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round" />
  </g>
</svg>
